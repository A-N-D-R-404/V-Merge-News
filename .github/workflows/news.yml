name: News Auto-Poster

on:
  schedule:
    - cron: '0 */4 * * *' # Запуск каждые 4 часа
  workflow_dispatch: # Кнопка для ручного запуска

permissions:
  contents: write # Дает права на коммит файла published_news.json

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests pollinations-client

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python news_bot.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Проверяем, существует ли файл перед добавлением
          if [ -f published_news.json ]; then
            git add published_news.json
            if git diff --cached --quiet; then
              echo "Нет изменений в state"
            else
              git commit -m "auto: update published news state [skip ci]"
              git push
            fi
          else
            echo "Файл published_news.json не был создан (вероятно, не было новых новостей)."
          fi
